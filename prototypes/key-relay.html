<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Key Relay · 界面原型</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --desktop: #e8e8e8;
      --surface: #f3f3f3;
      --paper: #fff;
      --text: #252525;
      --muted: #686868;
      --placeholder: #767676;
      --line: #d4d4d4;
      --control-line: #aaa;
      --accent: #326798;
      --success: #287044;
      --error: #a13d32;
      --focus: #3977ad;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--desktop);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, input, select { border-radius: 2px; }
    button { cursor: pointer; }
    button:disabled { cursor: default; color: #858585; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }
    .stage { width: min(600px, calc(100% - 32px)); margin: 28px auto 24px; }
    .review-label { display: flex; justify-content: space-between; margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    .window { container-type: inline-size; border: 1px solid #b9b9b9; background: var(--surface); box-shadow: 0 3px 14px #00000008; }
    .titlebar { height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: var(--paper); border-bottom: 1px solid #e4e4e4; }
    .app-icon { width: 20px; height: 20px; color: #4a4a4a; }
    .app-name { font-size: 14px; font-weight: 600; }
    .app-description { margin-left: auto; color: #777; font-size: 12px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr); padding: 10px 14px 0; }
    .tabs { display: flex; align-items: end; height: 29px; border-bottom: 1px solid var(--line); }
    .tab { height: 28px; min-width: 64px; padding: 3px 15px; border: 1px solid transparent; border-bottom: 0; background: transparent; position: relative; color: var(--muted); }
    .tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--text); top: 1px; height: 29px; }
    .tab:hover:enabled:not([aria-selected="true"]) { background: #e9e9e9; }
    .panel { display: flex; flex-direction: column; grid-area: 2 / 1; min-height: 258px; padding: 12px 0 0; }
    .panel[hidden] { display: flex !important; visibility: hidden; }
    .panel > * { flex-shrink: 0; }
    .footer-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; }
    .start-slot { display: flex; justify-content: flex-end; width: 172px; }
    textarea { display: block; width: 100%; border: 1px solid var(--control-line); border-radius: 0; background: var(--paper); padding: 9px 10px; line-height: 1.8; resize: vertical; }
    textarea::placeholder { color: var(--placeholder); }
    #source { flex-grow: 1; height: 184px; min-height: 130px; }
    textarea[readonly] { background: #fafafa; }
    .editor-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); margin-top: 6px; font-size: 12px; }
    input[type="number"] { height: 30px; width: 66px; padding: 2px 7px; border: 1px solid var(--control-line); background: var(--paper); }
    .footer { padding: 10px 14px 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    #status-message { display: flex; align-items: center; margin: 0; flex: 1; min-width: 0; min-height: 3.4em; color: var(--muted); font-size: 13px; line-height: 1.7; }
    #status-message:is([data-state="countdown"], [data-state="arming"], [data-state="typing"]) { color: var(--accent); }
    #status-message[data-state="done"] { color: var(--success); }
    #status-message[data-state="error"] { color: var(--error); }
    .button { min-height: 26px; padding: 2px 8px; border: 1px solid #b4b4b4; border-radius: 3px; font-size: 13px; background: #fafafa; box-shadow: 0 1px 1px #00000006; white-space: nowrap; }
    .button:hover:enabled { background: #f1f1f1; border-color: #929292; }
    .button:active:enabled { background: #e8e8e8; box-shadow: none; }
    .primary { min-width: 72px; flex: 0 0 auto; }
    .settings-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .settings-heading h2 { margin: 0; font-size: 14px; font-weight: 400; }
    .setting-row { display: grid; grid-template-columns: minmax(0, 1fr) 156px; align-items: center; gap: 4px 16px; }
    .setting-error { grid-column: 1 / -1; margin: 0; color: var(--error); font-size: 12px; }
    .setting-value:has([aria-invalid="true"]) { border-color: var(--error); }
    .setting-row + .setting-row { margin-top: 14px; }
    .setting-copy label { display: block; font-size: 13px; }
    .setting-copy p { margin: 2px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .setting-value { display: flex; align-items: center; height: 30px; border: 1px solid var(--control-line); border-radius: 2px; background: var(--paper); }
    .setting-value:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
    .setting-value input { width: 100%; min-width: 0; height: 28px; border: 0; background: transparent; outline: none; }
    .setting-value span { padding: 0 9px 0 4px; flex: 0 0 auto; color: var(--muted); font-size: 12px; }
    .setting-value:has(input:disabled) { background: #f5f5f5; }
    select { width: 100%; height: 30px; padding: 2px 24px 2px 8px; border: 1px solid var(--control-line); background: #fafafa; }
    .setting-note { margin: 16px 0 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.7; }
    .preview { margin-top: 14px; color: var(--muted); font-size: 12px; }
    .preview > summary { cursor: pointer; padding: 0 0 10px; user-select: none; }
    .preview-heading { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; }
    #target { height: 104px; min-height: 80px; font-size: 13px; border-color: #bcbcbc; background: #f9f9f9; }
    .preview-note { margin: 8px 0 0; line-height: 1.8; font-size: 11px; }
    @container (max-width: 560px) {
      .footer { align-items: stretch; flex-direction: column; gap: 8px; }
      .footer-actions { align-self: flex-end; }
    }
    @media (max-width: 520px) {
      .stage { width: calc(100% - 20px); margin-top: 16px; }
      .workspace { padding: 10px 12px 0; }
      .editor-meta { flex-wrap: wrap; }
      .footer { padding: 10px 12px 12px; }
      .app-description { display: none; }
      .setting-row { grid-template-columns: minmax(0, 1fr) 144px; column-gap: 12px; }
    }
    @media (max-width: 420px) {
      .setting-row { grid-template-columns: minmax(0, 1fr); row-gap: 6px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="review-label"><span>界面原型 / 待评审</span><span>浅色 · 紧凑布局</span></div>
    <section class="window" aria-label="Key Relay 文本自动输入">
      <header class="titlebar">
        <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="1"/><path d="M5 9h2m2 0h2m2 0h2m2 0h2M5 12h2m2 0h2m2 0h2m2 0h2M6 16h12"/></svg>
        <span class="app-name">Key Relay</span>
        <span class="app-description">文本自动输入</span>
      </header>
      <div class="workspace">
        <nav class="tabs" role="tablist" aria-label="功能页签">
          <button class="tab" id="input-tab" role="tab" aria-selected="true" aria-controls="input-panel">输入</button>
          <button class="tab" id="settings-tab" role="tab" aria-selected="false" aria-controls="settings-panel" tabindex="-1">设置</button>
        </nav>
        <section class="panel" id="input-panel" role="tabpanel" aria-labelledby="input-tab">
          <textarea id="source" spellcheck="false" placeholder="在此输入或粘贴文本…" aria-label="待输入文本" aria-describedby="text-count text-note"></textarea>
          <div class="editor-meta"><span id="text-count">0 个字符</span><span id="text-note">保留空格与换行</span></div>
        </section>
        <section class="panel" id="settings-panel" role="tabpanel" aria-labelledby="settings-tab" hidden>
          <div class="settings-heading"><h2>输入设置</h2><button class="button" id="restore">恢复默认</button></div>
          <div class="setting-row">
            <div class="setting-copy"><label for="delay">等待时间</label><p id="delay-note">按钮启动前等待 1～60 秒</p></div>
            <div class="setting-value"><input type="number" id="delay" min="1" max="60" step="1" value="5" aria-describedby="delay-note delay-unit delay-error" required><span id="delay-unit">秒</span></div>
            <p class="setting-error" id="delay-error" role="alert" hidden>请输入 1～60 秒的整数。</p>
          </div>
          <div class="setting-row">
            <div class="setting-copy"><label for="shortcut">快捷键</label><p id="shortcut-note">选定输入位置，松开组合键后开始</p></div>
            <select id="shortcut" aria-describedby="shortcut-note"><option value="F8">Ctrl + Alt + F8</option><option value="F9">Ctrl + Alt + F9</option><option value="F10">Ctrl + Alt + F10</option></select>
          </div>
          <div class="setting-row">
            <div class="setting-copy"><label for="interval">字符间隔</label><p id="interval-note">10～1,000 毫秒，数值越大输入越慢</p></div>
            <div class="setting-value"><input type="number" id="interval" min="10" max="1000" step="1" value="50" aria-describedby="interval-note interval-unit interval-error" required><span id="interval-unit">毫秒</span></div>
            <p class="setting-error" id="interval-error" role="alert" hidden>请输入 10～1,000 毫秒的整数。</p>
          </div>
          <p class="setting-note">输入期间，鼠标移动继续；鼠标按下或键盘按键停止。</p>
        </section>
      </div>
      <footer class="footer">
        <p id="status-message" role="status" aria-live="polite" data-state="idle">点击后等待 5 秒，请在此期间选择输入位置。</p>
        <div class="footer-actions"><div class="start-slot"><button class="button primary" id="start">开始输入</button></div><button class="button" id="clear" title="清空文本后可按 Ctrl+Z 撤销">清空</button></div>
      </footer>
    </section>
    <details class="preview">
      <summary>原型演示</summary>
      <div class="preview-heading"><label for="target">测试输入框</label><button class="button" id="clear-target">清空结果</button></div>
      <textarea id="target" placeholder="点击开始后，在倒计时结束前点击这里。" spellcheck="false"></textarea>
      <p class="preview-note">此区域用于评审交互，正式软件界面仅包含上方窗口。原型只在本页演示输入和快捷键，无法向其他程序输入；Enter、Tab 在此显示为文本。</p>
    </details>
  </main>
  <script>
    (() => {
      const source = document.querySelector('#source');
      const target = document.querySelector('#target');
      const delay = document.querySelector('#delay');
      const interval = document.querySelector('#interval');
      const shortcut = document.querySelector('#shortcut');
      const start = document.querySelector('#start');
      const message = document.querySelector('#status-message');
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const heldKeys = new Set();
      let state = 'idle';
      let timer;
      let characters = [];
      let sent = 0;
      let spacing = 50;
      let pointerHeld = false;
      let suppressedClickTarget = null;
      let interruptedKeys = false;
      let lastProgressTime = 0;
      const busy = () => ['countdown', 'arming', 'typing'].includes(state);

      function setStatus(next, heading, description) {
        state = next;
        message.dataset.state = next;
        message.setAttribute('aria-live', next === 'typing' ? 'off' : 'polite');
        message.textContent = next === 'idle'
          ? (delay.checkValidity() ? `点击后等待 ${delay.value} 秒，请在此期间选择输入位置。` : '请在设置中填写 1～60 秒的等待时间。')
          : `${heading}，${description}`;
        const active = busy();
        source.readOnly = active;
        for (const control of [delay, interval, shortcut, document.querySelector('#clear'), document.querySelector('#restore')]) control.disabled = active;
        start.disabled = next === 'typing' || next === 'arming';
        tabs[1].disabled = next === 'countdown';
        if (next !== 'countdown') start.textContent = next === 'typing' ? '正在输入…' : '开始输入';
      }

      function finish(heading, description, next = 'stopped') {
        clearTimeout(timer);
        if (next === 'stopped' && heldKeys.size) interruptedKeys = true;
        setStatus(next, heading, description);
      }

      function updateCount() {
        document.querySelector('#text-count').textContent = `${Array.from(source.value).length} 个字符`;
        if (!busy()) setStatus('idle');
      }

      function validateSetting(control) {
        const valid = control.validity.valid;
        document.getElementById(`${control.id}-error`).hidden = valid;
        control.setAttribute('aria-invalid', String(!valid));
        return valid;
      }

      function prepare() {
        if (!source.value.length) {
          setStatus('error', '请先填写文本', '在编辑区输入或粘贴需要发送的内容');
          tabs[0].click();
          source.focus();
          return false;
        }
        const invalidControls = [delay, interval].filter(control => !validateSetting(control));
        if (invalidControls.length) {
          tabs[1].click();
          setStatus('error', '请检查设置', '修正标出的参数后重新开始');
          invalidControls[0].focus();
          return false;
        }
        characters = Array.from(source.value);
        spacing = Number(interval.value);
        sent = 0;
        lastProgressTime = 0;
        return true;
      }

      function typeNext() {
        if (state !== 'typing') return;
        // This preview writes only into its own test field; native input belongs to Rust.
        target.setRangeText(characters[sent], target.selectionStart, target.selectionEnd, 'end');
        target.scrollTop = target.scrollHeight;
        sent += 1;
        if (sent === characters.length) {
          finish('已完成', `已发送 ${sent} 个字符`, 'done');
          return;
        }
        const now = performance.now();
        if (sent === 1 || now - lastProgressTime >= 250) {
          message.textContent = `已发送 ${sent} / ${characters.length} 字符 · 按键或点击停止`;
          lastProgressTime = now;
        }
        timer = setTimeout(typeNext, spacing);
      }

      function beginTyping() {
        if (document.activeElement !== target || document.hidden || !document.hasFocus()) {
          finish('已取消', '开始前请先点击下方测试输入框');
          return;
        }
        if (heldKeys.size || pointerHeld) {
          finish('已取消', '开始时仍有按键或鼠标按钮按下');
          return;
        }
        setStatus('typing', '正在输入', '鼠标按下或键盘按键可停止');
        typeNext();
      }

      start.addEventListener('click', () => {
        if (state === 'countdown') { finish('已取消', '倒计时已取消，尚未发送文本'); return; }
        if (busy() || !prepare()) return;
        const duration = Number(delay.value) * 1000;
        const deadline = performance.now() + duration;
        setStatus('countdown', '等待输入', '请在倒计时结束前选择输入位置');
        function tick() {
          const remaining = deadline - performance.now();
          if (remaining <= 0) { beginTyping(); return; }
          start.textContent = `取消输入（剩余 ${Math.ceil(remaining / 1000)} 秒）`;
          timer = setTimeout(tick, Math.min(100, remaining));
        }
        tick();
      });

      document.addEventListener('pointerdown', event => {
        pointerHeld = true;
        suppressedClickTarget = null;
        if (state === 'typing' || state === 'arming') {
          // Suppress activation when this pointer sequence began on a disabled control.
          suppressedClickTarget = event.target.closest(':disabled');
          finish('已中止', `已发送 ${sent} 个字符，剩余内容已取消`);
        }
      }, true);
      document.addEventListener('click', event => {
        if (event.detail > 0 && suppressedClickTarget?.contains(event.target)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
        suppressedClickTarget = null;
      }, true);
      document.addEventListener('pointerup', () => { pointerHeld = false; }, true);
      document.addEventListener('pointercancel', () => { pointerHeld = false; suppressedClickTarget = null; }, true);

      document.addEventListener('keydown', event => {
        heldKeys.add(event.code);
        const isShortcut = event.ctrlKey && event.altKey && !event.shiftKey && !event.metaKey && event.code === shortcut.value;
        if (interruptedKeys) {
          if (isShortcut) event.preventDefault();
          return;
        }
        if (state === 'typing') {
          finish('已中止', `已发送 ${sent} 个字符，剩余内容已取消`);
          return;
        }
        if (state === 'arming') {
          if (!event.repeat) finish('已取消', '等待释放期间发生其他按键');
          return;
        }
        if (state === 'countdown') {
          if (event.key === 'Escape' || isShortcut) {
            event.preventDefault();
            finish('已取消', '倒计时已取消，尚未发送文本');
          }
          return;
        }
        if (isShortcut && !event.repeat) {
          event.preventDefault();
          if (document.activeElement !== target) {
            setStatus('error', '请先选择输入位置', '本页演示请先点击下方测试输入框');
            return;
          }
          if (prepare()) setStatus('arming', '等待按键释放', '松开快捷键后开始输入');
        }
      }, true);
      document.addEventListener('keyup', event => {
        heldKeys.delete(event.code);
        if (!heldKeys.size) interruptedKeys = false;
        if (state === 'arming' && !heldKeys.size) beginTyping();
      }, true);
      window.addEventListener('blur', () => {
        heldKeys.clear();
        interruptedKeys = false;
        pointerHeld = false;
        suppressedClickTarget = null;
        if (busy()) finish('演示已结束', '浏览器外的操作请在桌面版本中验证');
      });

      for (const tab of tabs) {
        tab.addEventListener('click', () => {
          if (tab.disabled) return;
          document.querySelector('.footer').style.visibility = tab === tabs[0] ? '' : 'hidden';
          for (const item of tabs) {
            const selected = item === tab;
            item.setAttribute('aria-selected', String(selected));
            item.tabIndex = selected ? 0 : -1;
            document.getElementById(item.getAttribute('aria-controls')).hidden = !selected;
          }
        });
        tab.addEventListener('keydown', event => {
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          const next = event.key === 'Home' ? tabs[0] : event.key === 'End' ? tabs[1] : tabs[1 - tabs.indexOf(tab)];
          if (next.disabled) return;
          next.click();
          next.focus();
        });
      }
      source.addEventListener('input', updateCount);
      document.querySelector('#clear').addEventListener('click', () => {
        if (busy() || !source.value.length) return;
        source.focus();
        source.select();
        // Chromium's editing command keeps this deletion in the native undo history.
        if (!document.execCommand('delete')) {
          setStatus('error', '清空未完成', '可在文本框中全选并按 Delete');
          return;
        }
        updateCount();
        message.textContent = '已清空，按 Ctrl+Z 撤销。';
      });
      document.querySelector('#clear-target').addEventListener('click', () => { target.value = ''; });
      for (const control of [delay, interval]) {
        control.addEventListener('input', () => {
          validateSetting(control);
          if (!busy()) setStatus('idle');
        });
      }
      document.querySelector('#restore').addEventListener('click', () => {
        delay.value = '5';
        interval.value = '50';
        shortcut.value = 'F8';
        for (const control of [delay, interval]) validateSetting(control);
        setStatus('idle');
      });
    })();
  </script>
</body>
</html>

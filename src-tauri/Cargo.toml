[package]
name = "key-relay"
version = "0.2.3"
description = "Send prepared text as keyboard input on Windows"
authors = ["Key Relay contributors"]
edition = "2021"
rust-version = "1.91.1"

[lib]
name = "key_relay"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem"] }
tauri-plugin-updater = "2.13.1"
winreg = "0.55"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
